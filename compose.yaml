name: sagab

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sagab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sagab_postgres_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sagab"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sagab_postgres:/var/lib/postgresql/data
      - ./database:/database:ro
      - ./deploy/docker/init-db.sh:/docker-entrypoint-initdb.d/00-sagab.sh:ro

  backend:
    build:
      context: ./backend
    environment:
      SAGAB_DB_HOST: database
      SAGAB_DB_PORT: 5432
      SAGAB_DB_NAME: sagab
      SAGAB_DB_USER: sagab_app
      SAGAB_DB_PASSWORD: CAMBIAR_EN_PRODUCCION_app
      SAGAB_JWT_SECRET: SAGAB-demo-local-2026-cambiar-antes-de-produccion
      SAGAB_CORS: http://localhost:8088
      SAGAB_PUBLIC_API_URL: http://localhost:8088
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - sagab_uploads:/app/data/uploads
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  sagab_postgres:
  sagab_uploads:
