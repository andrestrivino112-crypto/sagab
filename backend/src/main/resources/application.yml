spring:
  application:
    name: sagab-backend
  datasource:
    url: jdbc:postgresql://${SAGAB_DB_HOST:localhost}:${SAGAB_DB_PORT:5432}/${SAGAB_DB_NAME:sagab}?currentSchema=sagab
    username: ${SAGAB_DB_USER:sagab_app}
    password: ${SAGAB_DB_PASSWORD:CAMBIAR_EN_PRODUCCION_app}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo gobiernan los scripts SQL, nunca Hibernate
    open-in-view: false
    properties:
      hibernate:
        default_schema: sagab
        jdbc.time_zone: America/Guayaquil
  mail:
    host: ${SAGAB_SMTP_HOST:smtp.gmail.com}
    port: 587
    username: ${SAGAB_SMTP_USER:}
    password: ${SAGAB_SMTP_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: ${SAGAB_UPLOAD_MAX_MB:100}MB
      max-request-size: ${SAGAB_UPLOAD_MAX_MB:100}MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never   # no filtrar detalles internos al cliente
  # En producción: habilitar HTTPS (RNF-03) con certificado y forzar redirección

sagab:
  jwt:
    # Clave HMAC-SHA256 de al menos 32 bytes. Definir por variable de entorno en producción.
    secret: ${SAGAB_JWT_SECRET:CAMBIAR-ESTA-CLAVE-POR-UNA-DE-32+-BYTES-ALEATORIA}
    access-minutes: 30
  seguridad:
    max-intentos-fallidos: 5
    minutos-bloqueo: 15
  cors:
    origenes: ${SAGAB_CORS:http://localhost:5173}
  storage:
    # S3-compatible es el proveedor recomendado. Cuando no hay SAGAB_S3_*, se usa almacenamiento
    # local real; en producción ese directorio debe estar montado sobre un volumen persistente.
    endpoint: ${SAGAB_S3_ENDPOINT:}
    region: ${SAGAB_S3_REGION:auto}
    bucket: ${SAGAB_S3_BUCKET:}
    access-key: ${SAGAB_S3_ACCESS_KEY:}
    secret-key: ${SAGAB_S3_SECRET_KEY:}
    local-dir: ${SAGAB_STORAGE_LOCAL_DIR:./data/uploads}
    # Vacío por defecto: StorageService emite una ruta relativa al origen actual. Definir una
    # URL absoluta solo cuando API y frontend se publiquen en orígenes distintos.
    public-base-url: ${SAGAB_PUBLIC_API_URL:}
  uploads:
    max-mb-deberes: ${SAGAB_UPLOAD_MAX_MB_DEBERES:15}
    max-mb-comprobante: ${SAGAB_UPLOAD_MAX_MB_COMPROBANTE:8}
    max-mb-recursos: ${SAGAB_UPLOAD_MAX_MB_RECURSOS:100}

logging:
  level:
    # Evita que un DEBUG global del entorno registre cuerpos HTTP, SQL o datos sensibles.
    org.springframework: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    ec.edu.bellini.sagab: INFO
