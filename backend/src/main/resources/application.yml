spring:
  application:
    name: sagab-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/sagab?currentSchema=sagab
    username: ${SAGAB_DB_USER:sagab_app}
    password: ${SAGAB_DB_PASSWORD:CAMBIAR_EN_PRODUCCION_app}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate        # el esquema lo gobiernan los scripts SQL, nunca Hibernate
    open-in-view: false
    properties:
      hibernate:
        default_schema: sagab
        jdbc.time_zone: America/Guayaquil
  mail:
    host: ${SAGAB_SMTP_HOST:smtp.gmail.com}
    port: 587
    username: ${SAGAB_SMTP_USER:}
    password: ${SAGAB_SMTP_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  error:
    include-stacktrace: never   # no filtrar detalles internos al cliente
  # En producción: habilitar HTTPS (RNF-03) con certificado y forzar redirección

sagab:
  jwt:
    # Clave HMAC-SHA256 de al menos 32 bytes. Definir por variable de entorno en producción.
    secret: ${SAGAB_JWT_SECRET:CAMBIAR-ESTA-CLAVE-POR-UNA-DE-32+-BYTES-ALEATORIA}
    access-minutes: 30
    refresh-days: 7
  seguridad:
    max-intentos-fallidos: 5
    minutos-bloqueo: 15
  cors:
    origenes: ${SAGAB_CORS:http://localhost:5173}

logging:
  level:
    org.springframework.security: INFO
